map $uri $fpm_uri_incoming {
  default  "";
  /status  /fpm-status;
  /ping    /ping;
}


log_format incoming '$remote_addr s=$status bi=$request_length bo=$bytes_sent uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time rt=$request_time ua="$http_user_agent" rq="$request"';

server {
  listen  8081;
  # server_name localhost;
  root    /var/www/html;
  index   index.php index.html;

  error_log /var/log/nginx/error.log info;
  access_log /var/log/nginx/access.log incoming;

  error_page  500 502 503 504  /50x.html;
  keepalive_timeout 0;

  set  $fpm_backend griotte_incoming:9000;

  location = /50x.html {
    root  /usr/share/nginx/html;
  }

  location ~ ^/(ping|status)$ {
    limit_except GET {
      allow  all;
    }

    resolver       127.0.0.11 valid=10s;
    include        fastcgi_params;
    fastcgi_pass   $fpm_backend;
    fastcgi_param  SCRIPT_FILENAME $fpm_uri_incoming;
    fastcgi_param  SCRIPT_NAME $fpm_uri_incoming;
  }

  location ~ ^/(phpi|phpinfo)$ {
    limit_except GET {
      allow  all;
    }

    try_files  $uri /index.php?phpi;
  }

  location / {
    limit_except GET POST {
      allow  all;
    }
    try_files  $uri /index.php?$query_string;
  }

  location ~ \.php$ {
    internal;
    resolver       127.0.0.11 valid=10s;
    include        fastcgi_params;
    fastcgi_pass   $fpm_backend;
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME  /var/www/html$fastcgi_script_name;
    fastcgi_hide_header X-Powered-By;
  }

}
